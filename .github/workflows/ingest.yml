name: Ingest natječaja

# Povlači aktualne pozive iz izvora u Supabase. Raspored + ručno pokretanje.
on:
  schedule:
    - cron: "0 */6 * * *" # svakih 6 sati (UTC)
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 22+ ima globalni WebSocket (treba @supabase/supabase-js)
          cache: npm
      - run: npm ci
      - name: Ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_EGRESS: global # samo izvori dostupni s GitHub IP-a (npr. SEDIA); HR portali idu preko Vercela
        run: npm run ingest
